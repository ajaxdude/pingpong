<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Router Dashboard</title>
  <style>
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --bg-tertiary: #3d3d3d;
      --text-primary: #e0e0e0;
      --text-secondary: #b0b0b0;
      --border-color: #444;
      --status-pending: #ff9800;
      --status-approved: #4caf50;
      --status-escalated: #2196f3;
      --status-error: #f44336;
      --accent-primary: #bb86fc;
      --accent-secondary: #03dac6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--bg-secondary);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      padding: 30px;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { font-size: 1.8rem; color: var(--accent-primary); display: flex; align-items: center; gap: 12px; }

    .nav-link { 
      color: var(--accent-primary); 
      text-decoration: none; 
      font-weight: 600; 
      padding: 10px 20px; 
      border-radius: 6px; 
      border: 1px solid var(--accent-primary); 
      transition: all 0.2s; 
    }
    .nav-link:hover { background: var(--accent-primary); color: #121212; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 2rem;
      color: var(--accent-primary);
      font-weight: 700;
    }

    .filter-bar {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-bar label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-right: 8px;
    }

    .filter-bar select,
    .filter-bar input {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .filter-bar select:focus,
    .filter-bar input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-bottom: 25px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td { 
      padding: 12px 16px; 
      text-align: left; 
      border-bottom: 1px solid var(--border-color); 
    }
    
    th { 
      background: rgba(0, 0, 0, 0.2); 
      font-weight: 600; 
      color: var(--text-primary); 
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
    }

    .badge-model {
      background: rgba(3, 218, 198, 0.2);
      color: var(--accent-secondary);
      border: 1px solid var(--accent-secondary);
    }

    .badge-approved {
      background: rgba(76, 175, 80, 0.2);
      color: var(--status-approved);
      border: 1px solid var(--status-approved);
    }

    .badge-needs-revision {
      background: rgba(255, 152, 0, 0.2);
      color: var(--status-pending);
      border: 1px solid var(--status-pending);
    }

    .badge-escalated {
      background: rgba(33, 150, 243, 0.2);
      color: var(--status-escalated);
      border: 1px solid var(--status-escalated);
    }

    .badge-unknown {
      background: rgba(128, 128, 128, 0.2);
      color: #999;
      border: 1px solid #666;
    }

    .badge-cached {
      background: rgba(76, 175, 80, 0.2);
      color: var(--status-approved);
      border: 1px solid var(--status-approved);
      font-size: 0.7rem;
    }

    .badge-fallback {
      background: rgba(244, 67, 54, 0.2);
      color: var(--status-error);
      border: 1px solid var(--status-error);
      font-size: 0.7rem;
    }

    .badge-muted {
      background: transparent;
      color: #666;
      border: none;
      font-size: 0.7rem;
    }

    .latency-fast { color: var(--status-approved); }
    .latency-medium { color: var(--status-pending); }
    .latency-slow { color: var(--status-error); }

    .timestamp {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .prompt-excerpt {
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }

    .error-banner {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid var(--status-error);
      color: var(--status-error);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-actions">
      <h1>🔀 PingPong Router Dashboard</h1>
      <a href="/review-requests" class="nav-link">📝 Review Requests →</a>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Decisions</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Latency (ms)</div>
        <div class="stat-value" id="statLatency">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cache Hit Rate (%)</div>
        <div class="stat-value" id="statCache">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Approval Rate (%)</div>
        <div class="stat-value" id="statApproval">—</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <label for="filterEffectiveness">Effectiveness:</label>
        <select id="filterEffectiveness" onchange="applyFilters()">
          <option value="all">All</option>
          <option value="approved">Approved</option>
          <option value="needs_revision">Needs Revision</option>
          <option value="escalated">Escalated</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterModel">Model:</label>
        <select id="filterModel" onchange="applyFilters()">
          <option value="all">All Models</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterSearch">Search Prompt:</label>
        <input type="text" id="filterSearch" placeholder="Type to search..." oninput="applyFilters()">
      </div>
    </div>

    <table id="eventsTable">
      <thead>
        <tr>
          <th width="15%">Timestamp</th>
          <th width="35%">Prompt Excerpt</th>
          <th width="12%">Model</th>
          <th width="10%">Latency</th>
          <th width="10%">Cached</th>
          <th width="10%">Fallback</th>
          <th width="12%">Effectiveness</th>
        </tr>
      </thead>
      <tbody id="eventsTableBody"></tbody>
    </table>
  </div>

  <script>
    let allEvents = [];

    async function fetchRoutingEvents() {
      const res = await fetch('/api/routing-events');
      const data = await res.json();
      return data.events || [];
    }

    function calculateStats(events) {
      if (!events.length) {
        return { total: 0, avgLatency: '—', cacheRate: '—', approvalRate: '—' };
      }

      const total = events.length;
      const totalLatency = events.reduce((sum, e) => sum + (e.latencyMs || 0), 0);
      const avgLatency = Math.round(totalLatency / total);
      
      const cachedCount = events.filter(e => e.cached).length;
      const cacheRate = Math.round((cachedCount / total) * 100);

      const knownEvents = events.filter(e => e.effectiveness !== 'unknown');
      const approvedCount = knownEvents.filter(e => e.effectiveness === 'approved').length;
      const approvalRate = knownEvents.length > 0 
        ? Math.round((approvedCount / knownEvents.length) * 100) 
        : '—';

      return { total, avgLatency, cacheRate, approvalRate };
    }

    function renderStats(stats) {
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statLatency').textContent = stats.avgLatency === '—' ? '—' : `${stats.avgLatency} ms`;
      document.getElementById('statCache').textContent = stats.cacheRate === '—' ? '—' : `${stats.cacheRate}%`;
      document.getElementById('statApproval').textContent = stats.approvalRate === '—' ? '—' : `${stats.approvalRate}%`;
    }

    function populateModelFilter(events) {
      const modelSelect = document.getElementById('filterModel');
      const uniqueModels = [...new Set(events.map(e => e.selectedModel))].sort();
      
      // Keep the "All Models" option
      modelSelect.innerHTML = '<option value="all">All Models</option>';
      
      uniqueModels.forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelSelect.appendChild(option);
      });
    }

    function getLatencyClass(latencyMs) {
      if (latencyMs < 500) return 'latency-fast';
      if (latencyMs <= 2000) return 'latency-medium';
      return 'latency-slow';
    }

    function truncateText(text, maxLength) {
      if (!text || text.length <= maxLength) return text || '';
      return text.substring(0, maxLength) + '...';
    }

    function renderTable(events) {
      const tbody = document.getElementById('eventsTableBody');
      tbody.innerHTML = '';

      if (!events.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                No routing decisions recorded yet.<br>
                Routing decisions appear here after the first review is processed.
              </div>
            </td>
          </tr>
        `;
        return;
      }

      // Sort by timestamp descending
      events.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      events.forEach(event => {
        const row = document.createElement('tr');
        
        const timestamp = new Date(event.timestamp).toLocaleString();
        const promptExcerpt = truncateText(event.promptExcerpt, 80);
        const promptFull = event.promptExcerpt || '';
        const latencyClass = getLatencyClass(event.latencyMs);
        
        const cachedBadge = event.cached 
          ? '<span class="badge badge-cached">✓ cached</span>' 
          : '<span class="badge badge-muted">—</span>';
        
        const fallbackBadge = event.fallback 
          ? '<span class="badge badge-fallback">⚠ fallback</span>' 
          : '<span class="badge badge-muted">—</span>';
        
        const effectivenessClass = `badge-${event.effectiveness.replace('_', '-')}`;

        row.innerHTML = `
          <td class="timestamp">${timestamp}</td>
          <td><span class="prompt-excerpt" title="${promptFull}">${promptExcerpt}</span></td>
          <td><span class="badge badge-model">${event.selectedModel}</span></td>
          <td class="${latencyClass}">${event.latencyMs} ms</td>
          <td>${cachedBadge}</td>
          <td>${fallbackBadge}</td>
          <td><span class="badge ${effectivenessClass}">${event.effectiveness}</span></td>
        `;

        tbody.appendChild(row);
      });
    }

    function applyFilters() {
      const effectivenessFilter = document.getElementById('filterEffectiveness').value;
      const modelFilter = document.getElementById('filterModel').value;
      const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

      let filtered = allEvents;

      if (effectivenessFilter !== 'all') {
        filtered = filtered.filter(e => e.effectiveness === effectivenessFilter);
      }

      if (modelFilter !== 'all') {
        filtered = filtered.filter(e => e.selectedModel === modelFilter);
      }

      if (searchFilter) {
        filtered = filtered.filter(e => 
          (e.promptExcerpt || '').toLowerCase().includes(searchFilter)
        );
      }

      renderTable(filtered);
    }

    async function refresh() {
      try {
        allEvents = await fetchRoutingEvents();
        
        const stats = calculateStats(allEvents);
        renderStats(stats);
        populateModelFilter(allEvents);
        applyFilters();

        document.getElementById('errorBanner').style.display = 'none';
      } catch (err) {
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.textContent = 'Error fetching routing events: ' + err.message;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
